services:
  mailrouter:
    build: .
    image: mailrouter:latest
    container_name: mailrouter
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - mailrouter-data:/data   # SQLite DB, Microsoft sign-in token cache, cookie keys

volumes:
  mailrouter-data:
