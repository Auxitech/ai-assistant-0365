# Same cluster as centimo (standalone tool, like k8s/status and k8s/sonarqube there).
# Deploy:  kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: centimo-mailrouter

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - sealed-secret-mailrouter-env.yaml

images:
  - name: mailrouter
    newName: ghcr.io/auxitech/mailrouter
    newTag: "1.0.2"   # bump on every release
