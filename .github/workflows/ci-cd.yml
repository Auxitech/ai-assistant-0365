name: CI/CD

# Same scheme as Auxitech/centimo:
# - every push / PR to main: build the app and the Docker image (no push)
# - a version tag (v1.2.3): build and push ghcr.io/auxitech/mailrouter:1.2.3 and :latest
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/auxitech/mailrouter

jobs:
  build-app:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/MailRouter.Web/MailRouter.Web.csproj

      - name: Build
        run: dotnet build src/MailRouter.Web/MailRouter.Web.csproj -c Release --no-restore

  docker:
    name: Docker image${{ startsWith(github.ref, 'refs/tags/v') && ' — build & push' || ' — build only' }}
    needs: [build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Uses the repo's GHCR_PUSH_TOKEN secret if one is set (like centimo), otherwise the built-in
      # GITHUB_TOKEN, which can push to ghcr.io/auxitech/* thanks to `packages: write` above.
      - uses: docker/login-action@v3
        if: steps.version.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUSH_TOKEN != '' && 'tim.allemann@auxitech.ch' || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN != '' && secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=mailrouter
          cache-to: type=gha,mode=max,scope=mailrouter
